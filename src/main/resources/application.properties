spring.application.name=invok-core

# SQLite with WAL mode
spring.datasource.url=jdbc:sqlite:data/invok.db?journal_mode=WAL
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.id.db_structure_naming_strategy=single

# HikariCP — single connection avoids SQLite lock contention
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-timeout=120000
spring.datasource.hikari.connection-init-sql=PRAGMA busy_timeout=10000
spring.datasource.hikari.connection-test-query=SELECT 1

# Virtual Threads
spring.threads.virtual.enabled=true

# Jasypt
jasypt.encryptor.password=${JASYPT_ENCRYPTOR_PASSWORD:invok-oss-default-key}

# Server
server.port=${PORT:8080}

# Invok
invok.mcp.server-name=Invok OSS
invok.version=1.0.0

# Security (SSRF default: block private IPs)
security.ssrf.allow-private-networks=false

# Health check disabled by default — set to true to enable periodic checks
invok.health-check.enabled=false
invok.health-check.cron=0 */5 * * * *
